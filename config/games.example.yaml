# Example config for unisense.
# Copy this file to "games.yaml" next to the executable, then adapt it.
#
# IMPORTANT: the `deg_per_count_at_ref` constants below are values widely
# cited publicly (mouse-sensitivity.com and competitive communities), BUT
# they are NOT verified by this project and may become wrong after a game
# update changes its sensitivity formula. Before relying on them for
# competitive play, verify them yourself (method in the README, section
# "Computing a new game's constant"). Entries marked [EXAMPLE] are
# illustrative values showing the expected format, NOT guaranteed-accurate
# constants.

settings:
  # Current hardware DPI of your mouse (vendor OSD/software setting).
  # Windows cannot read this value automatically: update it here if you
  # change the DPI on the mouse.
  mouse_dpi: 800

  # Universal target: cm of hand movement for one full turn (360deg) of the
  # camera. This is THE value you pick once and that will be honored across
  # every game below.
  target_cm_per_360: 35.0

  # Mouse button to toggle passthrough <-> last active game.
  # Accepted formats: "F9", "Ctrl+Alt+F9", "Mouse3" (middle click),
  # "Mouse4" (back button), "Mouse5" (forward button).
  toggle_hotkey: "Mouse4"

  # Cycles through the games listed below (forces leaving passthrough).
  cycle_game_hotkey: "Ctrl+Alt+F9"

  # true = start in passthrough (recommended: avoids an unexpected
  # sensitivity until you've explicitly selected a game).
  start_in_passthrough: true

games:
  - name: "Valorant"
    # Widely cited constant for Valorant (in-game sensitivity = 1).
    deg_per_count_at_ref: 0.07
    reference_sensitivity: 1.0
    source: "https://www.mouse-sensitivity.com/ (double-check)"

  - name: "Counter-Strike 2"
    # Source engine formula: deg/count = sensitivity * m_yaw. The value
    # below assumes the default m_yaw (0.022) and in-game sensitivity = 1.
    deg_per_count_at_ref: 0.022
    reference_sensitivity: 1.0
    source: "https://www.mouse-sensitivity.com/ (double-check, verify m_yaw)"

  - name: "Overwatch 2"
    deg_per_count_at_ref: 0.0066
    reference_sensitivity: 1.0
    source: "https://www.mouse-sensitivity.com/ (double-check)"

  - name: "Sea of Thieves"
    # [EXAMPLE] illustrative value, measure/verify before real use.
    deg_per_count_at_ref: 1.0
    reference_sensitivity: 1.0
    source: "UNVERIFIED - needs measuring (see README)"

  - name: "Skyrim"
    # [EXAMPLE] illustrative value, measure/verify before real use.
    # Many Bethesda games use a slider in "raw" units with no simple
    # relationship to 1.0: check the INI docs (fMouseHeadingSensitivity).
    deg_per_count_at_ref: 0.002
    reference_sensitivity: 1.0
    source: "UNVERIFIED - needs measuring (see README)"
    # Example direct-select hotkey for this game.
    hotkey: "Ctrl+Alt+F5"

  # Example (disabled) of automatic menu/gameplay detection via memory
  # reading, see README section "Automatic detection (advanced)".
  # Uncomment and fill in with your own offsets found via Cheat Engine:
  # these must be CHANGED, they will not work as-is on your
  # installation/version of the game.
  #
  # - name: "MyGame"
  #   deg_per_count_at_ref: 0.01
  #   reference_sensitivity: 1.0
  #   auto_detect:
  #     process_name: "MyGame.exe"
  #     module_name: "MyGame.exe"
  #     offset: 0x00ABCDEF
  #     pointer_chain: []
  #     in_game_bytes: [0x01]
  #     poll_interval_ms: 250
