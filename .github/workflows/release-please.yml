name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Un release cree avec le GITHUB_TOKEN par defaut ne declenche pas
  # lui-meme d'autres workflows (regle anti-recursion de GitHub) : l'event
  # `release: published` de publish-release-assets.yml ne se declencherait
  # jamais tout seul. On le dispatch explicitement a la place : un appel a
  # l'API Actions fait *depuis* un workflow en cours n'est pas soumis a
  # cette meme restriction.
  trigger-publish-release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-release-assets.yml',
              ref: 'main',
              inputs: { tag: '${{ needs.release-please.outputs.tag_name }}' },
            })
